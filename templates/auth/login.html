{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5"> 
            <div class="card shadow-lg border-0 border-primary border-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h2 class="mb-0 fs-3"><i class="fas fa-lock me-2"></i> User Login</h2>
                </div>
                <div class="card-body p-5">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-4">
                            <label for="username" class="form-label fs-5">Username:</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fs-5">Password:</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-xxl w-100 mt-3 shadow">
                            <i class="fas fa-sign-in-alt me-2"></i> ENTER SYSTEM
                        </button>
                    </form>
                    <p class="text-center mt-4 pt-3 border-top">
                        New Patient? <a href="{{ url_for('auth.register') }}" class="fw-bold text-success">Register Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
