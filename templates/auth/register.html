{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5"> 
            <div class="card shadow-lg border-0 border-success border-3">
                <div class="card-header bg-success text-white text-center py-3">
                    <h2 class="mb-0 fs-3"><i class="fas fa-user-plus me-2"></i> Patient Registration</h2>
                </div>
                <div class="card-body p-5">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-4">
                            <label for="username" class="form-label fs-5">Choose a Username:</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fs-5">Choose a Password:</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-xxl w-100 mt-3 shadow">
                            <i class="fas fa-check-circle me-2"></i> REGISTER ACCOUNT
                        </button>
                    </form>
                    <p class="text-center mt-4 pt-3 border-top">
                        Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Log In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
